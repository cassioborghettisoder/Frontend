<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — CodeVault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="container header__content">
      <a href="#" class="logo">CodeVault</a>
      <a href="#" class="header__signup-link">Novo por aqui? Criar conta</a>
    </div>
  </header>

  <main class="main">

    <section class="login-card container-narrow">
      <h1 class="login-card__title">Entrar no CodeVault</h1>

      <form class="login-form" action="#" method="post">
        <div class="form-group">
          <label for="username">Usuário ou e-mail</label>
          <input type="text" id="username" name="username" required />
        </div>

        <div class="form-group">
          <div class="form-group__header">
            <label for="password">Senha</label>
            <a href="#" class="form-group__link">Esqueceu a senha?</a>
          </div>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="login-form__submit">Entrar</button>
      </form>
    </section>

  </main>

  <footer class="footer">
    <nav class="footer__nav" aria-label="Links do rodapé">
      <ul class="footer__list">
        <li><a href="#">Termos</a></li>
        <li><a href="#">Privacidade</a></li>
        <li><a href="#">Central de Ajuda</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
    <p class="footer__copy">&copy; 2026 CodeVault</p>
  </footer>

</body>
</html>
